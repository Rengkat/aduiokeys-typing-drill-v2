<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AudioKeys - Offline</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background-color: #0a0a1a;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    }

    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #e5e7eb;
    }

    p {
      color: #9ca3af;
      max-width: 32rem;
      line-height: 1.5;
    }

    button {
      margin-top: 24px;
      background-color: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #7c73ff;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <main role="main" aria-live="polite">
    <h1>You're offline</h1>
    <p>
      AudioKeys can't reach the network right now. Check your connection and
      try again. Any progress already saved on this device is safe.
    </p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>

</html>
